spring.application.name=integration-service
# Server
server.port=8080

# Apache Camel
camel.springboot.name=ShoppingIntegrationService
camel.springboot.main-run-controller=true

# Service URLs
services.user-service=${USER_SERVICE_URL}
services.product-service=${PRODUCT_SERVICE_URL}
services.inventory-service=${INVENTORY_SERVICE_URL}
services.order-service=${ORDER_SERVICE_URL}
services.email-service=${EMAIL_SERVICE_URL}

# CORS — comma-separated list of allowed origins
# Override via CORS_ALLOWED_ORIGINS env var in Railway
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,https://shopping-admin-production.up.railway.app,https://shopping-customer-production.up.railway.app}